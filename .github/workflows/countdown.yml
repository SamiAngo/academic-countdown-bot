name: Academic Countdown Bot

`on`:
  schedule:
    - cron: "5 * * * *"   # every hour at minute 5 (times are UTC; the bot handles Ethiopian time)
  workflow_dispatch:       # lets you run it manually from the Actions tab
    inputs:
      post_now:
        description: "Post the countdown to the channel now"
        type: boolean
        default: true

permissions:
  contents: write          # needed to save events.json back to the repo

concurrency:
  group: countdown-bot     # never run two copies at the same time
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          FORCE_POST: ${{ github.event.inputs.post_now == 'true' }}
        run: python bot.py

      - name: Save event changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "🤖 Update events"
            git push
          fi

